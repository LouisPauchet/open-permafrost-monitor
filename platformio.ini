; Walter (DPTechnics/QuickSpot) - ESP32-S3 + Sequans GM02SP LTE-M/NB-IoT modem.
; No official PlatformIO board id exists for Walter, so this targets a
; generic ESP32-S3 board with flash/PSRAM settings matching Walter's spec
; (16MB flash, 2MB PSRAM) - confirm/adjust against the real board once in hand.
[env:walter]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_build.psram_type = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; WalterModem 1.5.0 needs C++17 and hits a missing ESP-IDF 5.x header on
; this platform version - see include/spi_flash_mmap.h and
; https://github.com/QuickSpot/walter-arduino/issues/142
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I include
    ; Native USB OTG/TinyUSB (mode 0), not the fixed-function USB-Serial/JTAG
    ; controller (mode 1) - needed so field service mode can expose the SD
    ; card as a USB mass-storage drive on the same port as the console (see
    ; sd_storage.cpp's sdStorageMsc* functions). ARDUINO_USB_CDC_ON_BOOT
    ; keeps Serial mapped to the TinyUSB CDC device; ARDUINO_USB_ON_BOOT is
    ; deliberately left off (defaults to 0) so main.cpp controls exactly
    ; when USB.begin() runs, after the MSC LUN is configured.
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; This is a *compile-time* ceiling (CONFIG_LOG_MAXIMUM_LEVEL) - it gates
    ; whether ESP_LOGD(...) calls exist in the binary at all. main.cpp's
    ; runtime esp_log_level_set("WalterModem", ESP_LOG_WARN) cannot undo a
    ; DEBUG compiled in at this level: confirmed on live hardware that with
    ; this at 4, WalterModem's ESP_LOGD RX/TX trace (hex-dumping every RTCM
    ; chunk) still printed in full despite that runtime call, which is what
    ; saturated the USB-CDC link and starved loopTask into a task-watchdog
    ; abort under heavy RTCM load (see commit "Reduce debug log verbosity to
    ; prevent watchdog resets under load" - that fix's runtime half never
    ; actually took effect because of this). WARN (2) actually removes the
    ; ESP_LOGD calls from the build; raise back to 4 only for a short,
    ; targeted debugging session, not left on during real operation.
    -D CORE_DEBUG_LEVEL=2
    ; arduino-esp32's HardwareSerial spawns "uart_event_task" (2048 bytes by
    ; default) to run onReceive() callbacks. WalterModem registers its own
    ; RX handler this way on the modem's UART - under a sustained RTCM
    ; burst that handler overflowed the default stack and crashed
    ; ("Stack canary watchpoint triggered (uart_event_task)", live hardware).
    ; This is arduino-esp32 core's own constant (HardwareSerial.cpp), not
    ; WalterModem's - unrelated to SET_LOOP_TASK_STACK_SIZE below, which only
    ; covers the main loop task.
    -D ARDUINO_SERIAL_EVENT_TASK_STACK_SIZE=8192

; WalterModem is NOT in lib_deps - it's vendored locally at lib/WalterModem
; with a one-line crash fix applied (see lib/WalterModem/README-PATCH.md).
; PlatformIO's Library Dependency Finder prefers a project lib/ folder over
; a registry package of the same name automatically.
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    bblanchon/ArduinoJson @ ^7.1.0
